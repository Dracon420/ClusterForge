<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArkPanel &mdash; sign in</title>

<link rel="icon" href="/static/arkpanel.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#0d0c0a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArkPanel">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">

<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/mobile.css">
<style>
  /* The login screen is the one page that is not dense, so it gets its own
     centred layout rather than the panel grid. */
  body { display: flex; align-items: center; justify-content: center;
         min-height: 100vh; padding: 20px; }
  .signin { width: 100%; max-width: 360px; }
  .signin .mark { text-align: center; margin-bottom: 14px; }
  .signin .mark img { width: 76px; height: 76px; border-radius: 16px; }
  .signin h1 { color: var(--amber); font-size: 15px; letter-spacing: .16em;
               text-transform: uppercase; text-align: center; margin: 10px 0 2px; }
  .signin .sub { color: var(--text-dim); font-size: 11px; text-align: center;
                 margin-bottom: 16px; }
  .signin label.lbl { display: block; color: var(--amber); font-size: 10px;
                      letter-spacing: .1em; text-transform: uppercase;
                      margin: 10px 0 4px; font-weight: 600; }
  .signin input[type=text], .signin input[type=password] {
    width: 100%; font: 14px "Segoe UI", sans-serif; padding: 11px 10px;
  }
  .signin .btn { width: 100%; margin: 16px 0 0; padding: 13px; font-size: 13px; }
  .signin .remember { display: flex; align-items: center; gap: 8px;
                      margin-top: 12px; color: var(--text-dim); font-size: 12px; }
  .signin .remember input { width: 18px; height: 18px; }
  .signin .foot { color: var(--text-faint); font-size: 10px; text-align: center;
                  margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>

<div class="signin">
  <div class="mark"><img src="/static/icons/icon-192.png" alt=""></div>
  <h1>ArkPanel</h1>
  <div class="sub">{{ cluster.id }}</div>

  <form method="post" class="group g-orange" autocomplete="on">
    <h3>&#128274; Sign in</h3>

    {% if error %}
    <div class="banner err">{{ error }}</div>
    {% endif %}

    <input type="hidden" name="next" value="{{ next }}">

    <label class="lbl" for="user">Username</label>
    <input type="text" id="user" name="user" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>

    <label class="lbl" for="password">Password</label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" required>

    <!-- Checked by default: without it the session dies with the browser and
         you retype a password on the phone every single time. -->
    <label class="remember">
      <input type="checkbox" name="remember" value="1" checked>
      Stay signed in on this device for 30 days
    </label>

    <button type="submit" class="btn green">Sign in</button>
  </form>

  <div class="foot">
    Controls the DraconCluster ARK servers.<br>
    Reachable only on your local network or your Tailscale devices.
  </div>
</div>

<script>
/* Registered here too, so the worker is live even if someone lands on the
   login page first -- which is exactly what happens on a phone's first visit,
   and Chrome checks installability on whatever page you are actually on. */
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
  });
}
</script>
</body>
</html>
